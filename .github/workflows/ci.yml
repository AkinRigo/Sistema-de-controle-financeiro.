name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Instalar dependências
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Testes com cobertura
        run: |
          coverage run -m pytest -q
          coverage report
      - name: Migrações sobem e descem
        env:
          PAINEL_DATABASE_URL: sqlite:///./ci.db
        run: |
          alembic upgrade head
          alembic downgrade base

  frontend:
    name: Frontend (tipos + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Checar tipos e gerar build
        run: npm run build

  publicar-vertra:
    name: Atualizar branch deploy (Vertra Cloud)
    # Só na main e só se backend e frontend passaram. A Vertra publica a branch "deploy".
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Montar o site (mesmo endereço do backend)
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Publicar na branch deploy
        run: |
          ALVO=deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$ALVO"
          git add -f frontend/dist
          git commit -m "$ALVO: ${GITHUB_SHA::7} de $GITHUB_REF_NAME (site montado)"
          git push -f origin "$ALVO"
